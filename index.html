<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/icon.png">
  <title>Calculator</title>
</head>
<body>
  <div id="UI">
    <div id="result">
      <div id="prevInput">777</div>
      <div id="input">999</div>
    </div>
    <div id="buttons">
      <button class="button" id="delete">⌫</button>
      <button class="button" id="clear">C</button>
      <button class="button">%</button>
      <button class="button side">÷</button>
      <button class="button">7</button>
      <button class="button">8</button>
      <button class="button">9</button>
      <button class="button side">x</button>
      <button class="button">4</button>
      <button class="button">5</button>
      <button class="button">6</button>
      <button class="button side">-</button>
      <button class="button">1</button>
      <button class="button">2</button>
      <button class="button">3</button>
      <button class="button side">+</button>
      <button class="button">±</button>
      <button class="button">0</button>
      <button class="button">,</button>
      <button class="button side" id="equal">=</button>
    </div>
  </div>
</body>
</html>
