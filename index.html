<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/icon.png">
  <title>Calculator</title>
</head>
<body>
  <div id="UI">
    <div id="result">
      <div id="prevInput">0</div>
      <div id="input">0</div>
    </div>
    <div id="buttons">
      <button class="button top" id="delete">⌫</button>
      <button class="button top" id="clear">C</button>
      <button class="button top" id="percent">%</button>
      <button class="button side" id="divide">÷</button>
      <button class="button" id="btn7">7</button>
      <button class="button" id="btn8">8</button>
      <button class="button" id="btn9">9</button>
      <button class="button side" id="multiply">x</button>
      <button class="button" id="btn4">4</button>
      <button class="button" id="btn5">5</button>
      <button class="button" id="btn6">6</button>
      <button class="button side" id="minus">-</button>
      <button class="button" id="btn1">1</button>
      <button class="button" id="btn2">2</button>
      <button class="button" id="btn3">3</button>
      <button class="button side" id="plus">+</button>
      <button class="button" id="changeSign">±</button>
      <button class="button" id="btn0">0</button>
      <button class="button" id="coma">,</button>
      <button class="button side" id="equal">=</button>
    </div>
  </div>
</body>
</html>
